<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전자로그북 - 감사추적</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div id="header"></div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <span>감사추적 (Audit Trail)</span>
                <button class="btn btn-primary btn-sm" onclick="exportAuditPDF()">PDF 출력</button>
            </div>
            <div class="card-body">
                <div class="filter-bar">
                    <div class="form-group">
                        <label>이벤트 유형</label>
                        <select id="filterEvent" onchange="applyFilter()">
                            <option value="">전체</option>
                            <option value="LOGIN">로그인</option>
                            <option value="LOGIN_FAIL">로그인 실패</option>
                            <option value="LOGOUT">로그아웃</option>
                            <option value="LOG_CREATE">로그 기록 작성</option>
                            <option value="ACCOUNT_CREATE">계정 생성</option>
                            <option value="ACCOUNT_STATUS">계정 상태변경</option>
                            <option value="PASSWORD_RESET">비밀번호 초기화</option>
                            <option value="SETTINGS_CHANGE">설정 변경</option>
                            <option value="PDF_EXPORT">PDF 출력</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>사용자 ID</label>
                        <input type="text" id="filterUserId" onkeyup="applyFilter()" placeholder="검색...">
                    </div>
                    <div class="form-group">
                        <label>시작일</label>
                        <input type="date" id="filterFrom" onchange="applyFilter()">
                    </div>
                    <div class="form-group">
                        <label>종료일</label>
                        <input type="date" id="filterTo" onchange="applyFilter()">
                    </div>
                    <button class="btn btn-secondary btn-sm" onclick="clearFilter()">초기화</button>
                </div>

                <div id="auditCount" style="margin-bottom:12px; font-size:13px; color:#666;"></div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>No.</th>
                                <th>일시</th>
                                <th>이벤트 유형</th>
                                <th>사용자 ID</th>
                                <th>사용자 이름</th>
                                <th>상세 내용</th>
                            </tr>
                        </thead>
                        <tbody id="auditTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="logoutWarning" class="logout-warning"></div>

    <script src="js/app.js"></script>
    <script>
        const session = initPage('audit');
        let filteredAudit = [];

        if (session) {
            if (session.role !== 'Manager') {
                alert('Manager 권한이 필요합니다.');
                window.location.href = 'dashboard.html';
            } else {
                applyFilter();
            }
        }

        const eventTypeLabels = {
            'LOGIN': '로그인',
            'LOGIN_FAIL': '로그인 실패',
            'LOGOUT': '로그아웃',
            'LOG_CREATE': '로그 기록 작성',
            'ACCOUNT_CREATE': '계정 생성',
            'ACCOUNT_STATUS': '계정 상태변경',
            'PASSWORD_RESET': '비밀번호 초기화',
            'SETTINGS_CHANGE': '설정 변경',
            'EQUIPMENT_ADD': '장비 추가',
            'EQUIPMENT_REMOVE': '장비 삭제',
            'PDF_EXPORT': 'PDF 출력'
        };

        function applyFilter() {
            const trail = JSON.parse(localStorage.getItem('auditTrail') || '[]');
            const eventType = document.getElementById('filterEvent').value;
            const userId = document.getElementById('filterUserId').value.trim().toLowerCase();
            const dateFrom = document.getElementById('filterFrom').value;
            const dateTo = document.getElementById('filterTo').value;

            filteredAudit = trail.filter(entry => {
                if (eventType && entry.eventType !== eventType) return false;
                if (userId && !entry.userId.toLowerCase().includes(userId)) return false;
                if (dateFrom && entry.timestamp.split('T')[0] < dateFrom) return false;
                if (dateTo && entry.timestamp.split('T')[0] > dateTo) return false;
                return true;
            }).reverse(); // 최신순

            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('auditTable');
            const countEl = document.getElementById('auditCount');

            countEl.textContent = '조회 결과: ' + filteredAudit.length + '건';

            tbody.innerHTML = filteredAudit.map((entry, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${formatDateTime(entry.timestamp)}</td>
                    <td>${eventTypeLabels[entry.eventType] || entry.eventType}</td>
                    <td>${escapeHtml(entry.userId)}</td>
                    <td>${escapeHtml(entry.userName)}</td>
                    <td>${escapeHtml(entry.detail)}</td>
                </tr>
            `).join('');
        }

        function clearFilter() {
            document.getElementById('filterEvent').value = '';
            document.getElementById('filterUserId').value = '';
            document.getElementById('filterFrom').value = '';
            document.getElementById('filterTo').value = '';
            applyFilter();
        }

        function exportAuditPDF() {
            if (filteredAudit.length === 0) {
                alert('출력할 데이터가 없습니다.');
                return;
            }

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('l', 'mm', 'a4');
                const printTime = formatDateTime(new Date());

                doc.setFontSize(16);
                doc.text('Audit Trail Report', 14, 15);
                doc.setFontSize(10);
                doc.text('Print Date/Time: ' + printTime, 14, 22);
                doc.text('Printed by: ' + session.userName + ' (' + session.userId + ')', 14, 28);

                const tableData = filteredAudit.map((entry, i) => [
                    i + 1,
                    formatDateTime(entry.timestamp),
                    eventTypeLabels[entry.eventType] || entry.eventType,
                    entry.userId,
                    entry.userName,
                    entry.detail
                ]);

                doc.autoTable({
                    startY: 34,
                    head: [['No.', 'Date/Time', 'Event Type', 'User ID', 'User Name', 'Detail']],
                    body: tableData,
                    styles: { fontSize: 8 },
                    headStyles: { fillColor: [26, 58, 92] },
                    didDrawPage: function(data) {
                        doc.setFontSize(8);
                        doc.text('Printed: ' + printTime, 14, doc.internal.pageSize.height - 10);
                    }
                });

                doc.save('Audit_Trail_' + formatDate(new Date()) + '.pdf');

                addAuditLog('PDF_EXPORT', session.userId, session.userName,
                    '감사추적 PDF 출력 - ' + filteredAudit.length + '건');
            } catch (e) {
                alert('PDF 출력에 인터넷 연결이 필요합니다.');
            }
        }
    </script>
</body>
</html>
