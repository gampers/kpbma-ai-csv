<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전자로그북 - 대시보드</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header"></div>

    <div class="container">
        <div class="dashboard-grid" id="dashboardGrid"></div>

        <div class="card">
            <div class="card-header">최근 사용 로그</div>
            <div class="card-body">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>장비명</th>
                                <th>시작 시간</th>
                                <th>종료 시간</th>
                                <th>사용 목적</th>
                                <th>작성자</th>
                                <th>전자서명 일시</th>
                            </tr>
                        </thead>
                        <tbody id="recentLogs"></tbody>
                    </table>
                </div>
                <div id="noLogs" style="display:none; text-align:center; padding:40px; color:#999;">
                    아직 기록된 사용 로그가 없습니다.
                </div>
            </div>
        </div>
    </div>

    <div id="logoutWarning" class="logout-warning"></div>

    <script src="js/app.js"></script>
    <script>
        const session = initPage('dashboard');

        if (session) {
            renderDashboard();
        }

        function renderDashboard() {
            const logs = JSON.parse(localStorage.getItem('logRecords') || '[]');
            const accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
            const settings = JSON.parse(localStorage.getItem('systemSettings') || '{}');

            // 통계 카드
            const grid = document.getElementById('dashboardGrid');
            let cards = `
                <a href="logbook.html" class="stat-card">
                    <span class="stat-icon">&#128221;</span>
                    <h3>로그 기록 작성</h3>
                    <div class="stat-value">NEW</div>
                </a>
                <a href="history.html" class="stat-card">
                    <span class="stat-icon">&#128202;</span>
                    <h3>전체 사용 로그</h3>
                    <div class="stat-value">${logs.length}건</div>
                </a>
            `;

            if (session.role === 'Manager') {
                cards += `
                    <a href="admin.html" class="stat-card">
                        <span class="stat-icon">&#128101;</span>
                        <h3>등록 계정 수</h3>
                        <div class="stat-value">${accounts.length}명</div>
                    </a>
                    <a href="audit.html" class="stat-card">
                        <span class="stat-icon">&#128274;</span>
                        <h3>감사추적</h3>
                        <div class="stat-value">조회</div>
                    </a>
                `;
            }

            grid.innerHTML = cards;

            // 최근 로그 5건
            const tbody = document.getElementById('recentLogs');
            const noLogs = document.getElementById('noLogs');

            if (logs.length === 0) {
                noLogs.style.display = 'block';
                tbody.parentElement.parentElement.style.display = 'none';
            } else {
                const recent = logs.slice(-5).reverse();
                tbody.innerHTML = recent.map(log => `
                    <tr>
                        <td>${escapeHtml(log.equipment)}</td>
                        <td>${formatDateTime(log.startTime)}</td>
                        <td>${formatDateTime(log.endTime)}</td>
                        <td>${escapeHtml(log.purpose)}</td>
                        <td>${escapeHtml(log.signedName)} (${escapeHtml(log.signedBy)})</td>
                        <td>${formatDateTime(log.signedAt)}</td>
                    </tr>
                `).join('');
            }
        }
    </script>
</body>
</html>
