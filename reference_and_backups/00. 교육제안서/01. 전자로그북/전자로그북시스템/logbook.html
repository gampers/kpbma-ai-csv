<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전자로그북 - 로그 기록</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header"></div>

    <div class="container">
        <div class="card">
            <div class="card-header">장비 사용 로그 기록</div>
            <div class="card-body">
                <div id="formMsg"></div>

                <form id="logForm" onsubmit="return handleSubmit(event)">
                    <div class="form-group">
                        <label for="equipment">장비 선택</label>
                        <select id="equipment">
                            <option value="">-- 장비를 선택하세요 --</option>
                        </select>
                    </div>

                    <div class="form-group" id="customEquipGroup" style="display:none;">
                        <label for="customEquipment">장비명 직접 입력</label>
                        <input type="text" id="customEquipment" placeholder="장비명을 입력하세요">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="startTime">작업 시작 시간</label>
                            <input type="datetime-local" id="startTime" required>
                        </div>
                        <div class="form-group">
                            <label for="endTime">작업 종료 시간</label>
                            <input type="datetime-local" id="endTime" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="purpose">장비 사용 목적</label>
                        <textarea id="purpose" placeholder="장비 사용 목적을 입력하세요" required></textarea>
                    </div>

                    <div class="signature" id="signaturePreview">
                        <strong>전자서명 정보 (저장 시 자동 기록)</strong>
                        서명자: <span id="sigUser"></span><br>
                        서명 일시: 저장 시점에 자동 기록됩니다.
                    </div>

                    <div style="margin-top:20px; display:flex; gap:12px;">
                        <button type="submit" class="btn btn-success">저장 (전자서명)</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()">초기화</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="logoutWarning" class="logout-warning"></div>

    <script src="js/app.js"></script>
    <script>
        const session = initPage('logbook');

        if (session) {
            loadEquipmentList();
            document.getElementById('sigUser').textContent = session.userName + ' (' + session.userId + ')';
        }

        function loadEquipmentList() {
            const settings = JSON.parse(localStorage.getItem('systemSettings') || '{}');
            const list = settings.equipmentList || [];
            const select = document.getElementById('equipment');

            list.forEach(eq => {
                const opt = document.createElement('option');
                opt.value = eq;
                opt.textContent = eq;
                select.appendChild(opt);
            });

            // 직접입력 옵션
            const customOpt = document.createElement('option');
            customOpt.value = '__custom__';
            customOpt.textContent = '[ 직접 입력 ]';
            select.appendChild(customOpt);

            select.addEventListener('change', function() {
                document.getElementById('customEquipGroup').style.display =
                    this.value === '__custom__' ? 'block' : 'none';
            });
        }

        function handleSubmit(e) {
            e.preventDefault();

            let equipment = document.getElementById('equipment').value;
            if (equipment === '__custom__') {
                equipment = document.getElementById('customEquipment').value.trim();
                if (!equipment) {
                    showMsg('error', '장비명을 입력해 주세요.');
                    return false;
                }
            }
            if (!equipment) {
                showMsg('error', '장비를 선택해 주세요.');
                return false;
            }

            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const purpose = document.getElementById('purpose').value.trim();

            if (new Date(endTime) <= new Date(startTime)) {
                showMsg('error', '종료 시간은 시작 시간보다 이후여야 합니다.');
                return false;
            }

            if (!purpose) {
                showMsg('error', '사용 목적을 입력해 주세요.');
                return false;
            }

            const now = new Date();
            const record = {
                recordId: generateUUID(),
                equipment: equipment,
                startTime: startTime,
                endTime: endTime,
                purpose: purpose,
                signedBy: session.userId,
                signedName: session.userName,
                signedAt: now.toISOString()
            };

            // 저장
            const logs = JSON.parse(localStorage.getItem('logRecords') || '[]');
            logs.push(record);
            localStorage.setItem('logRecords', JSON.stringify(logs));

            // 감사추적
            addAuditLog('LOG_CREATE', session.userId, session.userName,
                '로그 기록 작성 - 장비: ' + equipment);

            showMsg('success', '사용 로그가 저장되었습니다. 전자서명 완료: ' + formatDateTime(now));
            resetForm();

            return false;
        }

        function resetForm() {
            document.getElementById('logForm').reset();
            document.getElementById('customEquipGroup').style.display = 'none';
        }

        function showMsg(type, msg) {
            document.getElementById('formMsg').innerHTML =
                '<div class="alert alert-' + type + '">' + escapeHtml(msg) + '</div>';
            setTimeout(() => { document.getElementById('formMsg').innerHTML = ''; }, 5000);
        }
    </script>
</body>
</html>
