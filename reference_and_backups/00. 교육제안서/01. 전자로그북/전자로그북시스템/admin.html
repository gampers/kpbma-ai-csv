<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전자로그북 - 계정 관리</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header"></div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <span>계정 관리</span>
                <button class="btn btn-primary btn-sm" onclick="showCreateModal()">신규 계정 생성</button>
            </div>
            <div class="card-body">
                <div id="adminMsg"></div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>이름</th>
                                <th>권한</th>
                                <th>생성일</th>
                                <th>비밀번호 변경일</th>
                                <th>상태</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="accountTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 계정 생성 모달 -->
    <div class="modal-overlay" id="createModal">
        <div class="modal">
            <h2>신규 Operator 계정 생성</h2>
            <div id="modalMsg"></div>
            <form onsubmit="return createAccount(event)">
                <div class="form-group">
                    <label for="newId">사용자 ID</label>
                    <input type="text" id="newId" required placeholder="영문/숫자 조합">
                </div>
                <div class="form-group">
                    <label for="newName">이름</label>
                    <input type="text" id="newName" required placeholder="사용자 이름">
                </div>
                <div class="form-group">
                    <label for="newPw">비밀번호</label>
                    <input type="password" id="newPw" required placeholder="비밀번호 정책에 맞게 입력">
                </div>
                <div class="form-group">
                    <label for="newPwConfirm">비밀번호 확인</label>
                    <input type="password" id="newPwConfirm" required placeholder="비밀번호 재입력">
                </div>
                <div id="policyInfo" class="alert alert-info" style="font-size:12px;"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">취소</button>
                    <button type="submit" class="btn btn-primary">생성</button>
                </div>
            </form>
        </div>
    </div>

    <div id="logoutWarning" class="logout-warning"></div>

    <script src="js/app.js"></script>
    <script>
        const session = initPage('admin');

        if (session) {
            if (session.role !== 'Manager') {
                alert('Manager 권한이 필요합니다.');
                window.location.href = 'dashboard.html';
            } else {
                renderAccounts();
            }
        }

        function renderAccounts() {
            const accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
            const tbody = document.getElementById('accountTable');

            tbody.innerHTML = accounts.map(acc => `
                <tr>
                    <td>${escapeHtml(acc.id)}</td>
                    <td>${escapeHtml(acc.name)}</td>
                    <td><span class="user-badge ${acc.role === 'Manager' ? 'manager' : ''}">${acc.role}</span></td>
                    <td>${formatDateTime(acc.createdAt)}</td>
                    <td>${formatDateTime(acc.passwordChangedAt)}</td>
                    <td>${acc.active ? '<span style="color:#38a169">활성</span>' : '<span style="color:#e53e3e">비활성</span>'}</td>
                    <td>
                        ${acc.role !== 'Manager' ? `
                            <button class="btn btn-sm ${acc.active ? 'btn-danger' : 'btn-success'}"
                                onclick="toggleAccount('${acc.id}')">
                                ${acc.active ? '비활성화' : '활성화'}
                            </button>
                            <button class="btn btn-sm btn-secondary" onclick="resetPassword('${acc.id}')">
                                PW 초기화
                            </button>
                        ` : '<span style="color:#999; font-size:12px;">-</span>'}
                    </td>
                </tr>
            `).join('');
        }

        function showCreateModal() {
            document.getElementById('createModal').classList.add('active');
            document.getElementById('modalMsg').innerHTML = '';

            const settings = JSON.parse(localStorage.getItem('systemSettings') || '{}');
            const policy = settings.passwordPolicy || {};
            let info = '비밀번호 정책: ';
            if (policy.minLength) info += `최소 ${policy.minLength}자`;
            if (policy.requireUppercase) info += ', 대문자 포함';
            if (policy.requireNumber) info += ', 숫자 포함';
            if (policy.requireSpecialChar) info += ', 특수문자 포함';
            document.getElementById('policyInfo').textContent = info;
        }

        function closeModal() {
            document.getElementById('createModal').classList.remove('active');
        }

        function createAccount(e) {
            e.preventDefault();

            const id = document.getElementById('newId').value.trim();
            const name = document.getElementById('newName').value.trim();
            const pw = document.getElementById('newPw').value;
            const pwConfirm = document.getElementById('newPwConfirm').value;

            if (pw !== pwConfirm) {
                document.getElementById('modalMsg').innerHTML =
                    '<div class="alert alert-error">비밀번호가 일치하지 않습니다.</div>';
                return false;
            }

            // 비밀번호 정책 검증
            const validation = validatePassword(pw);
            if (!validation.valid) {
                document.getElementById('modalMsg').innerHTML =
                    '<div class="alert alert-error">비밀번호 정책 위반:<br>' + validation.errors.join('<br>') + '</div>';
                return false;
            }

            // 중복 ID 체크
            const accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
            if (accounts.find(a => a.id === id)) {
                document.getElementById('modalMsg').innerHTML =
                    '<div class="alert alert-error">이미 존재하는 ID입니다.</div>';
                return false;
            }

            const now = new Date().toISOString();
            accounts.push({
                id: id,
                password: hashPassword(pw),
                name: name,
                role: 'Operator',
                createdAt: now,
                passwordChangedAt: now,
                active: true
            });

            localStorage.setItem('accounts', JSON.stringify(accounts));

            addAuditLog('ACCOUNT_CREATE', session.userId, session.userName,
                'Operator 계정 생성: ' + id + ' (' + name + ')');

            closeModal();
            renderAccounts();
            document.getElementById('adminMsg').innerHTML =
                '<div class="alert alert-success">계정이 생성되었습니다: ' + escapeHtml(id) + '</div>';

            return false;
        }

        function toggleAccount(accountId) {
            const accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
            const acc = accounts.find(a => a.id === accountId);
            if (acc) {
                acc.active = !acc.active;
                localStorage.setItem('accounts', JSON.stringify(accounts));

                addAuditLog('ACCOUNT_STATUS', session.userId, session.userName,
                    '계정 ' + (acc.active ? '활성화' : '비활성화') + ': ' + accountId);

                renderAccounts();
            }
        }

        function resetPassword(accountId) {
            const newPw = prompt(accountId + ' 계정의 새 비밀번호를 입력하세요:');
            if (!newPw) return;

            const validation = validatePassword(newPw);
            if (!validation.valid) {
                alert('비밀번호 정책 위반:\n' + validation.errors.join('\n'));
                return;
            }

            const accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
            const acc = accounts.find(a => a.id === accountId);
            if (acc) {
                acc.password = hashPassword(newPw);
                acc.passwordChangedAt = new Date().toISOString();
                localStorage.setItem('accounts', JSON.stringify(accounts));

                addAuditLog('PASSWORD_RESET', session.userId, session.userName,
                    '비밀번호 초기화: ' + accountId);

                renderAccounts();
                document.getElementById('adminMsg').innerHTML =
                    '<div class="alert alert-success">' + escapeHtml(accountId) + ' 비밀번호가 초기화되었습니다.</div>';
            }
        }
    </script>
</body>
</html>
