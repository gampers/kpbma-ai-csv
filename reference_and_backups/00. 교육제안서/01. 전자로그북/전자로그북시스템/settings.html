<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전자로그북 - 시스템 설정</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header"></div>

    <div class="container">
        <div id="settingsMsg"></div>

        <!-- 자동 로그아웃 설정 -->
        <div class="card">
            <div class="card-header">자동 로그아웃 설정</div>
            <div class="card-body">
                <div class="form-group">
                    <label for="autoLogoutMin">자동 로그아웃 시간 (분)</label>
                    <input type="number" id="autoLogoutMin" min="1" max="120" style="max-width:200px;">
                </div>
                <button class="btn btn-primary" onclick="saveAutoLogout()">저장</button>
            </div>
        </div>

        <!-- 패스워드 정책 -->
        <div class="card">
            <div class="card-header">패스워드 정책 설정</div>
            <div class="card-body">
                <div class="form-row">
                    <div class="form-group">
                        <label for="pwMinLen">최소 길이</label>
                        <input type="number" id="pwMinLen" min="4" max="30">
                    </div>
                    <div class="form-group">
                        <label for="pwChangeDays">변경 주기 (일)</label>
                        <input type="number" id="pwChangeDays" min="0" max="365">
                    </div>
                </div>
                <div class="form-group">
                    <label>복잡성 요건</label>
                    <div style="display:flex; gap:20px; flex-wrap:wrap; margin-top:8px;">
                        <label style="font-weight:normal; display:flex; align-items:center; gap:6px;">
                            <input type="checkbox" id="pwUpper"> 대문자 포함
                        </label>
                        <label style="font-weight:normal; display:flex; align-items:center; gap:6px;">
                            <input type="checkbox" id="pwNumber"> 숫자 포함
                        </label>
                        <label style="font-weight:normal; display:flex; align-items:center; gap:6px;">
                            <input type="checkbox" id="pwSpecial"> 특수문자 포함
                        </label>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="savePasswordPolicy()">저장</button>
            </div>
        </div>

        <!-- 장비 목록 관리 -->
        <div class="card">
            <div class="card-header">장비 목록 관리</div>
            <div class="card-body">
                <div style="display:flex; gap:12px; margin-bottom:16px;">
                    <input type="text" id="newEquipment" placeholder="장비명 입력" style="flex:1; padding:10px 14px; border:2px solid #e2e8f0; border-radius:6px; font-size:14px;">
                    <button class="btn btn-success" onclick="addEquipment()">추가</button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>No.</th>
                                <th>장비명</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="equipmentTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="logoutWarning" class="logout-warning"></div>

    <script src="js/app.js"></script>
    <script>
        const session = initPage('settings');

        if (session) {
            if (session.role !== 'Manager') {
                alert('Manager 권한이 필요합니다.');
                window.location.href = 'dashboard.html';
            } else {
                loadSettings();
            }
        }

        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('systemSettings') || '{}');
            const policy = settings.passwordPolicy || {};

            document.getElementById('autoLogoutMin').value = settings.autoLogoutMinutes || 15;
            document.getElementById('pwMinLen').value = policy.minLength || 8;
            document.getElementById('pwChangeDays').value = policy.changeIntervalDays || 90;
            document.getElementById('pwUpper').checked = policy.requireUppercase !== false;
            document.getElementById('pwNumber').checked = policy.requireNumber !== false;
            document.getElementById('pwSpecial').checked = policy.requireSpecialChar !== false;

            renderEquipmentList();
        }

        function saveAutoLogout() {
            const settings = JSON.parse(localStorage.getItem('systemSettings') || '{}');
            settings.autoLogoutMinutes = parseInt(document.getElementById('autoLogoutMin').value) || 15;
            localStorage.setItem('systemSettings', JSON.stringify(settings));

            addAuditLog('SETTINGS_CHANGE', session.userId, session.userName,
                '자동 로그아웃 시간 변경: ' + settings.autoLogoutMinutes + '분');

            showMsg('success', '자동 로그아웃 설정이 저장되었습니다.');
        }

        function savePasswordPolicy() {
            const settings = JSON.parse(localStorage.getItem('systemSettings') || '{}');
            settings.passwordPolicy = {
                minLength: parseInt(document.getElementById('pwMinLen').value) || 8,
                requireUppercase: document.getElementById('pwUpper').checked,
                requireNumber: document.getElementById('pwNumber').checked,
                requireSpecialChar: document.getElementById('pwSpecial').checked,
                changeIntervalDays: parseInt(document.getElementById('pwChangeDays').value) || 90
            };
            localStorage.setItem('systemSettings', JSON.stringify(settings));

            addAuditLog('SETTINGS_CHANGE', session.userId, session.userName, '패스워드 정책 변경');

            showMsg('success', '패스워드 정책이 저장되었습니다.');
        }

        function renderEquipmentList() {
            const settings = JSON.parse(localStorage.getItem('systemSettings') || '{}');
            const list = settings.equipmentList || [];
            const tbody = document.getElementById('equipmentTable');

            tbody.innerHTML = list.map((eq, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${escapeHtml(eq)}</td>
                    <td><button class="btn btn-sm btn-danger" onclick="removeEquipment(${i})">삭제</button></td>
                </tr>
            `).join('');
        }

        function addEquipment() {
            const input = document.getElementById('newEquipment');
            const name = input.value.trim();
            if (!name) { alert('장비명을 입력하세요.'); return; }

            const settings = JSON.parse(localStorage.getItem('systemSettings') || '{}');
            if (!settings.equipmentList) settings.equipmentList = [];

            if (settings.equipmentList.includes(name)) {
                alert('이미 등록된 장비입니다.');
                return;
            }

            settings.equipmentList.push(name);
            localStorage.setItem('systemSettings', JSON.stringify(settings));

            addAuditLog('EQUIPMENT_ADD', session.userId, session.userName, '장비 추가: ' + name);

            input.value = '';
            renderEquipmentList();
            showMsg('success', '장비가 추가되었습니다: ' + name);
        }

        function removeEquipment(index) {
            const settings = JSON.parse(localStorage.getItem('systemSettings') || '{}');
            const removed = settings.equipmentList.splice(index, 1)[0];
            localStorage.setItem('systemSettings', JSON.stringify(settings));

            addAuditLog('EQUIPMENT_REMOVE', session.userId, session.userName, '장비 삭제: ' + removed);

            renderEquipmentList();
        }

        function showMsg(type, msg) {
            document.getElementById('settingsMsg').innerHTML =
                '<div class="alert alert-' + type + '">' + escapeHtml(msg) + '</div>';
            setTimeout(() => { document.getElementById('settingsMsg').innerHTML = ''; }, 3000);
        }
    </script>
</body>
</html>
