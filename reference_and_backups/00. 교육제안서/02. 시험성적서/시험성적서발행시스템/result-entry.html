<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>시험성적서 발행 시스템 - 시험결과 입력</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
    <script src="js/results.js" defer></script>
</head>
<body>
    <header id="header"></header>
    <main class="page">
        <div class="page-header">
            <div>
                <h2>시험결과 입력</h2>
                <p>시험 결과는 미승인 상태로 저장되며 승인자 승인 후 성적서 출력이 가능합니다.</p>
            </div>
        </div>

        <section class="panel">
            <div id="entryAlert" class="alert"></div>
            <form id="resultForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="testDate">시험일자 <span class="required">*</span></label>
                        <input id="testDate" name="testDate" type="date" required>
                    </div>
                    <div class="field">
                        <label for="productName">품목명</label>
                        <input id="productName" name="productName" placeholder="예: 완제품 A">
                    </div>
                    <div class="field">
                        <label for="sampleName">검체명</label>
                        <input id="sampleName" name="sampleName" placeholder="예: 안정성 검체">
                    </div>
                    <div class="field">
                        <label for="lotNo">제조번호/Lot No.</label>
                        <input id="lotNo" name="lotNo" placeholder="예: LOT-20260504">
                    </div>
                    <div class="field">
                        <label for="testItem">시험항목</label>
                        <input id="testItem" name="testItem" placeholder="예: 함량">
                    </div>
                    <div class="field">
                        <label for="equipment">시험 장비 <span class="required">*</span></label>
                        <input id="equipment" name="equipment" list="equipmentOptions" required placeholder="예: HPLC-001">
                        <datalist id="equipmentOptions"></datalist>
                    </div>
                    <div class="field full">
                        <label for="specificationMethod">시험기준/방법 <span class="required">*</span></label>
                        <textarea id="specificationMethod" name="specificationMethod" required placeholder="예: 자사 시험방법 SOP-QC-001, USP 기준"></textarea>
                    </div>
                    <div class="field">
                        <label for="resultValue">결과값 <span class="required">*</span></label>
                        <input id="resultValue" name="resultValue" required placeholder="예: 99.8">
                    </div>
                    <div class="field">
                        <label for="unit">단위</label>
                        <input id="unit" name="unit" placeholder="예: %, mg/mL">
                    </div>
                </div>
                <div class="actions">
                    <button class="btn secondary" type="reset">초기화</button>
                    <button class="btn" type="submit">저장</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
