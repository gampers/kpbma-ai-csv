<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>시험성적서 발행 시스템 - 계정 관리</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
    <script src="js/admin.js" defer></script>
</head>
<body>
    <header id="header"></header>
    <main class="page">
        <div class="page-header">
            <div>
                <h2>계정 관리</h2>
                <p>사용자 계정과 시험자/승인자 권한을 관리합니다.</p>
            </div>
        </div>

        <section class="panel">
            <div class="panel-title">
                <h3>신규 계정</h3>
            </div>
            <div id="adminAlert" class="alert"></div>
            <form id="accountForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="accountId">사용자 ID <span class="required">*</span></label>
                        <input id="accountId" required>
                    </div>
                    <div class="field">
                        <label for="accountName">사용자명 <span class="required">*</span></label>
                        <input id="accountName" required>
                    </div>
                    <div class="field">
                        <label for="accountPassword">초기 비밀번호 <span class="required">*</span></label>
                        <input id="accountPassword" type="password" required>
                    </div>
                    <div class="field">
                        <label for="accountRole">권한 <span class="required">*</span></label>
                        <select id="accountRole" required>
                            <option value="Tester">시험자</option>
                            <option value="Approver">승인자</option>
                        </select>
                    </div>
                </div>
                <div class="actions">
                    <button class="btn" type="submit">계정 생성</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="panel-title">
                <h3>계정 목록</h3>
            </div>
            <div id="accountsTable" class="table-wrap"></div>
        </section>
    </main>
</body>
</html>
