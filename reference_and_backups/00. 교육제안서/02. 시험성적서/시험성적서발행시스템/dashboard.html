<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>시험성적서 발행 시스템 - 대시보드</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <header id="header"></header>
    <main class="page">
        <div class="page-header">
            <div>
                <h2>대시보드</h2>
                <p id="dashboardLead"></p>
            </div>
        </div>

        <section class="grid four" id="stats"></section>

        <section class="panel">
            <div class="panel-title">
                <h3>최근 시험결과</h3>
                <a class="btn secondary small" href="result-list.html">전체 조회</a>
            </div>
            <div id="recentResults" class="table-wrap"></div>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const session = COAApp.initPage("dashboard");
            if (!session) return;

            const results = COAApp.getResults();
            const settings = COAApp.getSettings();
            const draftCount = results.filter(item => item.status === "Draft").length;
            const approvedCount = results.filter(item => item.status === "Approved").length;
            const myCount = results.filter(item => item.createdBy === session.userId).length;

            document.getElementById("dashboardLead").textContent =
                `${session.userName} (${COAApp.roleLabel(session.role)}) / 자동 백업 시간 ${settings.backupTime || "미설정"}`;

            document.getElementById("stats").innerHTML = [
                ["미승인 결과", draftCount],
                ["승인 완료", approvedCount],
                ["내 작성 결과", myCount],
                ["계정 수", COAApp.getAccounts().length]
            ].map(item => `
                <article class="stat-card">
                    <div class="label">${item[0]}</div>
                    <div class="value">${item[1]}</div>
                </article>
            `).join("");

            const recent = [...results].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5);
            const target = document.getElementById("recentResults");
            if (!recent.length) {
                target.innerHTML = '<div class="empty">등록된 시험결과가 없습니다.</div>';
                return;
            }
            target.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>문서번호</th>
                            <th>상태</th>
                            <th>품목/검체</th>
                            <th>시험항목</th>
                            <th>작성자</th>
                            <th>작성일시</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${recent.map(item => `
                            <tr>
                                <td class="mono">${COAApp.escapeHtml(item.documentNo)}</td>
                                <td>${COAApp.resultStatusBadge(item.status)}</td>
                                <td>${COAApp.escapeHtml(item.productName || "-")} / ${COAApp.escapeHtml(item.sampleName || "-")}</td>
                                <td>${COAApp.escapeHtml(item.testItem || "-")}</td>
                                <td>${COAApp.escapeHtml(item.createdByName)} (${COAApp.escapeHtml(item.createdBy)})</td>
                                <td>${COAApp.formatDateTime(item.createdAt)}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        });
    </script>
</body>
</html>
