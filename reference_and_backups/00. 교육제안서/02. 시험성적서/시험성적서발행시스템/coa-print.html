<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>시험성적서 발행 시스템 - 성적서 출력</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
    <script src="js/coa.js" defer></script>
</head>
<body>
    <header id="header"></header>
    <main class="page">
        <div class="page-header">
            <div>
                <h2>성적서 출력</h2>
                <p>승인 완료된 시험성적서만 출력할 수 있습니다.</p>
            </div>
            <button class="btn accent" id="printButton" type="button" disabled>출력</button>
        </div>

        <section class="panel">
            <div class="filters">
                <div class="field">
                    <label for="coaKeyword">키워드</label>
                    <input id="coaKeyword" placeholder="문서번호, 품목, 검체">
                </div>
                <div class="field">
                    <label for="coaSelect">승인 완료 결과</label>
                    <select id="coaSelect"></select>
                </div>
                <div></div>
                <div></div>
                <button class="btn secondary" id="previewButton" type="button">미리보기</button>
            </div>
            <div id="coaAlert" class="alert"></div>
        </section>

        <section class="coa-preview" id="printArea"></section>
    </main>
</body>
</html>
