<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COA 시험성적서 자동판정 시스템</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-shape bg-a"></div>
  <div class="bg-shape bg-b"></div>

  <main class="container">
    <section id="loginView" class="card login-card">
      <h1>COA 시험성적서 자동판정</h1>
      <p class="sub">교육용 MVP · 로컬 브라우저 실행</p>
      <form id="loginForm" autocomplete="off">
        <label for="loginId">ID</label>
        <input id="loginId" type="text" placeholder="admin" required>

        <label for="loginPw">PW</label>
        <input id="loginPw" type="password" placeholder="비밀번호" required>

        <button id="loginBtn" type="submit">로그인</button>
      </form>
      <p class="hint">기본 계정: admin / 1234</p>
      <p id="loginMsg" class="msg"></p>
    </section>

    <section id="appView" class="hidden">
      <header class="card topbar">
        <div>
          <h2>COA 자동판정 시스템</h2>
          <p id="sessionInfo" class="sub"></p>
        </div>
        <div class="topbar-actions">
          <span id="storageModeBadge" class="badge">Storage: -</span>
          <button id="logoutBtn" class="ghost">로그아웃</button>
        </div>
      </header>

      <nav class="card navtabs">
        <button id="tabWizard" class="tab active">판정 위저드</button>
        <button id="tabSettings" class="tab">설정</button>
      </nav>

      <section id="wizardPanel" class="card panel">
        <div class="stepper">
          <span id="stepLabel">1/5</span>
          <div class="progress"><div id="progressBar"></div></div>
        </div>

        <div id="step1" class="step">
          <h3>1단계 · 허용기준 설정</h3>
          <div class="grid two">
            <div>
              <label for="critMin">숫자 하한 (min)</label>
              <input id="critMin" type="number" step="0.01" placeholder="예: 10.00">
            </div>
            <div>
              <label for="critMax">숫자 상한 (max)</label>
              <input id="critMax" type="number" step="0.01" placeholder="예: 20.00">
            </div>
          </div>

          <label for="critTexts">허용 텍스트 목록 (쉼표 또는 줄바꿈 구분)</label>
          <textarea id="critTexts" rows="4" placeholder="예: PASS, APPROVED"></textarea>

          <div class="grid two">
            <div>
              <label for="timeoutMin">자동 로그아웃(분, 1~30)</label>
              <input id="timeoutMin" type="number" min="1" max="30" value="5">
            </div>
          </div>

          <div class="actions">
            <button id="saveCriteriaBtn">기준 저장</button>
            <button id="toStep2Btn" class="ghost">다음 단계</button>
          </div>
          <p id="criteriaMsg" class="msg"></p>
        </div>

        <div id="step2" class="step hidden">
          <h3>2단계 · 결과값 입력</h3>
          <div class="grid two">
            <div>
              <label for="sampleId">샘플 ID</label>
              <input id="sampleId" type="text" placeholder="예: S-001">
            </div>
            <div>
              <label for="lotNo">배치번호 (Lot No)</label>
              <input id="lotNo" type="text" placeholder="예: LOT-2401">
            </div>
          </div>

          <div class="grid two">
            <div>
              <label for="textValue">텍스트 시험값</label>
              <input id="textValue" type="text" placeholder="예: PASS">
            </div>
            <div>
              <label for="numericValue">숫자 시험값 (소수점 2자리)</label>
              <input id="numericValue" type="text" placeholder="예: 12.34 또는 12,34">
            </div>
          </div>

          <div class="actions">
            <button id="calcBtn">자동 판정 실행</button>
            <button id="backTo1Btn" class="ghost">이전</button>
          </div>
          <p id="draftStatus" class="hint"></p>
          <p id="inputMsg" class="msg"></p>
        </div>

        <div id="step3" class="step hidden">
          <h3>3단계 · 자동판정 결과</h3>
          <dl class="kv" id="resultView"></dl>
          <div class="actions">
            <button id="toStep4Btn">확정 단계로 이동</button>
            <button id="backTo2Btn" class="ghost">이전</button>
          </div>
          <p id="resultMsg" class="msg"></p>
        </div>

        <div id="step4" class="step hidden">
          <h3>4단계 · 판정 확정</h3>
          <label for="failReason">부적합 사유 (부적합 시 필수)</label>
          <textarea id="failReason" rows="4" placeholder="부적합일 때 사유를 입력하세요"></textarea>

          <div class="actions">
            <button id="confirmBtn">판정 확정</button>
            <button id="backTo3Btn" class="ghost">이전</button>
          </div>
          <p id="confirmMsg" class="msg"></p>
        </div>

        <div id="step5" class="step hidden">
          <h3>5단계 · 보고서 출력</h3>
          <dl class="kv" id="reportPreview"></dl>
          <div class="actions">
            <button id="printReportBtn">인쇄/PDF 저장</button>
            <button id="newRecordBtn" class="ghost">새 판정 시작</button>
          </div>
          <p id="reportMsg" class="msg"></p>
        </div>
      </section>

      <section id="settingsPanel" class="card panel hidden">
        <h3>설정</h3>
        <p class="sub">데이터 내보내기, 이력 조회 및 실습 초기화</p>
        <div class="actions">
          <button id="exportAuditBtn">Audit CSV 내보내기</button>
          <button id="exportRecordsBtn">판정기록 CSV 내보내기</button>
          <button id="resetDataBtn" class="danger">실습 데이터 초기화</button>
        </div>

        <hr class="divider">
        <h4>판정 이력 조회</h4>
        <div class="grid two">
          <div>
            <label for="recordSearchInput">검색 (샘플 ID / Lot / 레코드 ID)</label>
            <input id="recordSearchInput" type="text" placeholder="예: S-001, LOT-2401, REC_">
          </div>
          <div>
            <label for="recordStatusFilter">판정 상태</label>
            <select id="recordStatusFilter">
              <option value="all">전체</option>
              <option value="적합">적합</option>
              <option value="부적합">부적합</option>
            </select>
          </div>
        </div>
        <p id="recordCount" class="hint"></p>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>생성시각</th>
                <th>레코드 ID</th>
                <th>샘플 ID</th>
                <th>Lot</th>
                <th>판정</th>
                <th>작업</th>
              </tr>
            </thead>
            <tbody id="recordTableBody">
              <tr><td colspan="6">저장된 기록이 없습니다.</td></tr>
            </tbody>
          </table>
        </div>
        <p id="settingsMsg" class="msg"></p>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
