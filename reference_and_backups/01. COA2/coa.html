<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>COA 시험성적서 발행 시스템 (CSV 교육)</title>
<style>
:root {
  --bg: #f4f6f8; --panel: #ffffff; --ink: #1f2937; --muted: #6b7280;
  --line: #e5e7eb; --line-2: #d1d5db; --primary: #0f766e; --primary-d: #115e59;
  --accent: #2563eb; --warn: #b45309; --error: #b91c1c; --ok: #047857;
  --chip-bg: #ecfdf5; --chip-ink: #065f46;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: "Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif; font-size: 14px; }
a { color: var(--accent); text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

/* Layout */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between;
  background: var(--primary); color: #fff; padding: 10px 20px; }
.topbar h1 { font-size: 16px; margin: 0; font-weight: 700; }
.topbar .right { font-size: 13px; }
.topbar .right .userchip { background: var(--primary-d); padding: 4px 10px;
  border-radius: 12px; margin-right: 8px; }
.topbar .right button { background: transparent; color: #fff; border: 1px solid #fff;
  padding: 4px 10px; border-radius: 4px; font-size: 12px; }
.shell { display: flex; flex: 1; }
.sidenav { width: 200px; background: #ffffff; border-right: 1px solid var(--line); padding: 12px 0; }
.sidenav .group { padding: 4px 16px; color: var(--muted); font-size: 11px;
  text-transform: uppercase; margin-top: 12px; }
.sidenav a { display: block; padding: 8px 16px; color: var(--ink); border-left: 3px solid transparent; }
.sidenav a:hover { background: #f3f4f6; }
.sidenav a.active { background: #ecfdf5; border-left-color: var(--primary); color: var(--primary-d); font-weight: 600; }
.main { flex: 1; padding: 20px; overflow: auto; }
.page-title { font-size: 18px; font-weight: 700; margin: 0 0 14px; }

/* Cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 14px; margin: 0 0 12px; color: var(--ink); }
.grid { display: grid; gap: 12px; }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.kpi .label { color: var(--muted); font-size: 12px; }
.kpi .value { font-size: 22px; font-weight: 700; color: var(--primary-d); margin-top: 6px; }

/* Forms */
.form-row { display: grid; grid-template-columns: 140px 1fr; gap: 12px; align-items: start;
  margin-bottom: 10px; }
.form-row label { padding-top: 8px; color: var(--muted); font-size: 13px; }
.form-row label.req::after { content: " *"; color: var(--error); }
.form-row input, .form-row select, .form-row textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 4px;
  font-family: inherit; font-size: 13px; background: #fff; color: var(--ink); }
.form-row input:focus, .form-row textarea:focus, .form-row select:focus {
  outline: 2px solid #5eead4; outline-offset: -1px; border-color: var(--primary); }
.form-row .field-error { color: var(--error); font-size: 12px; margin-top: 4px; display: block; }
.form-row.invalid input, .form-row.invalid textarea, .form-row.invalid select { border-color: var(--error); background: #fef2f2; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

/* Buttons */
.btn { padding: 8px 14px; border-radius: 4px; border: 1px solid var(--line-2); background: #fff;
  color: var(--ink); font-size: 13px; }
.btn:hover { background: #f9fafb; }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn.primary:hover { background: var(--primary-d); }
.btn.danger { background: var(--error); color: #fff; border-color: var(--error); }
.btn.warn { background: var(--warn); color: #fff; border-color: var(--warn); }
.btn[disabled], .btn.disabled { opacity: 0.5; cursor: not-allowed; }
.btn.sm { padding: 4px 8px; font-size: 12px; }

/* Tables */
table.list { width: 100%; border-collapse: collapse; font-size: 13px; }
table.list th, table.list td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; }
table.list th { background: #f9fafb; color: var(--muted); font-weight: 600; }
table.list tr:hover td { background: #f9fafb; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge.draft { background: #fef3c7; color: #92400e; }
.badge.submitted { background: #dbeafe; color: #1e40af; }
.badge.approved { background: var(--chip-bg); color: var(--chip-ink); }
.badge.printed { background: #ede9fe; color: #5b21b6; }
.badge.rejected { background: #fee2e2; color: #991b1b; }
.badge.locked { background: #1f2937; color: #f9fafb; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex;
  align-items: center; justify-content: center; z-index: 100; }
.modal { background: #fff; border-radius: 8px; padding: 20px; width: 480px; max-width: 90vw;
  max-height: 85vh; overflow: auto; }
.modal h3 { margin: 0 0 14px; font-size: 16px; }

/* Toast */
.toast-wrap { position: fixed; top: 64px; right: 20px; z-index: 200; display: flex;
  flex-direction: column; gap: 8px; }
.toast { padding: 10px 14px; border-radius: 6px; color: #fff; font-size: 13px;
  box-shadow: 0 4px 12px rgba(0,0,0,.15); min-width: 220px; }
.toast.info { background: var(--accent); }
.toast.ok { background: var(--ok); }
.toast.warn { background: var(--warn); }
.toast.error { background: var(--error); }

/* Login */
.login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh;
  background: linear-gradient(135deg, #0f766e 0%, #115e59 100%); }
.login-box { background: #fff; padding: 32px; border-radius: 12px; width: 380px;
  box-shadow: 0 20px 50px rgba(0,0,0,.2); }
.login-box h1 { font-size: 18px; margin: 0 0 6px; color: var(--primary-d); }
.login-box .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
.login-box .seed-info { background: #f3f4f6; padding: 10px; border-radius: 6px;
  font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.6; }

/* COA Print */
.coa-printable { background: #fff; padding: 30px; border: 1px solid var(--line);
  border-radius: 8px; max-width: 800px; margin: 0 auto; }
.coa-printable h1 { text-align: center; font-size: 22px; margin: 0 0 6px; }
.coa-printable .coa-sub { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 20px; }
.coa-printable table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.coa-printable table th, .coa-printable table td { border: 1px solid #333; padding: 8px 10px; font-size: 13px; }
.coa-printable table th { background: #f3f4f6; width: 18%; text-align: left; font-weight: 600; }
.coa-printable .footer-note { font-size: 11px; color: var(--muted); margin-top: 14px; text-align: center; }
.coa-printable .stamp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.coa-printable .stamp { border: 1px solid #333; padding: 10px; min-height: 70px; }
.coa-printable .stamp .ttl { font-size: 11px; color: var(--muted); }
.coa-printable .stamp .body { font-size: 13px; margin-top: 4px; }

@media print {
  body { background: #fff; }
  .topbar, .sidenav, .toast-wrap, .no-print { display: none !important; }
  .main { padding: 0; }
  .coa-printable { border: 0; padding: 0; max-width: none; }
}

/* Utility */
.row { display: flex; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
.muted { color: var(--muted); font-size: 12px; }
.spacer { flex: 1; }
.hist-table { font-size: 12px; }
.hist-table .before { color: var(--error); text-decoration: line-through; }
.hist-table .after { color: var(--ok); font-weight: 600; }
.empty { color: var(--muted); padding: 20px; text-align: center; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div class="toast-wrap" id="toast-root"></div>

<script>
(function () {
'use strict';

/* =========================================================================
 * 1) 상수 / 유틸
 * ========================================================================= */
var KEYS = {
  USERS: 'coa:users', RECORDS: 'coa:records', HISTORY: 'coa:history',
  AUDIT: 'coa:audit', SETTINGS: 'coa:settings', SEQUENCE: 'coa:sequence',
  BACKUP_META: 'coa:backupMeta', SESSION: 'coa:session'
};
var ROLES = { TESTER: 'TESTER', APPROVER: 'APPROVER', ADMIN: 'ADMIN' };
var STATUS = { DRAFT: 'DRAFT', SUBMITTED: 'SUBMITTED', APPROVED: 'APPROVED',
               REJECTED: 'REJECTED', PRINTED: 'PRINTED' };
var STATUS_LABEL = { DRAFT: '작성중', SUBMITTED: '승인대기',
                     APPROVED: '승인완료', REJECTED: '반려', PRINTED: '출력완료' };
var ROLE_LABEL = { TESTER: '시험자', APPROVER: '승인자', ADMIN: '관리자' };

function pad2(n) { return String(n).padStart(2, '0'); }
function formatKst(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate())
    + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}
function formatDateOnly(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function formatDateKey(d) {
  d = d || new Date();
  return d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate());
}
function uid(prefix) {
  return (prefix || '') + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, function (c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

/* =========================================================================
 * 2) Storage helper
 * ========================================================================= */
var storage = {
  get: function (key, defaultVal) {
    try { var v = localStorage.getItem(key); return v == null ? (defaultVal != null ? defaultVal : null) : JSON.parse(v); }
    catch (e) { return defaultVal != null ? defaultVal : null; }
  },
  set: function (key, val) { localStorage.setItem(key, JSON.stringify(val)); },
  remove: function (key) { localStorage.removeItem(key); }
};

/* =========================================================================
 * 3) 시드 데이터 주입 (최초 1회)
 * ========================================================================= */
function seedIfEmpty() {
  if (!storage.get(KEYS.USERS)) {
    storage.set(KEYS.USERS, [
      { userId: 'admin',     name: '관리자', passwordPlain: 'admin', roles: [ROLES.ADMIN],     active: true, createdAt: formatKst(), createdBy: 'system' },
      { userId: 'tester1',   name: '김시험', passwordPlain: '1234',  roles: [ROLES.TESTER],   active: true, createdAt: formatKst(), createdBy: 'system' },
      { userId: 'approver1', name: '박승인', passwordPlain: '1234',  roles: [ROLES.APPROVER], active: true, createdAt: formatKst(), createdBy: 'system' }
    ]);
  }
  if (!storage.get(KEYS.RECORDS)) storage.set(KEYS.RECORDS, []);
  if (!storage.get(KEYS.HISTORY)) storage.set(KEYS.HISTORY, []);
  if (!storage.get(KEYS.AUDIT)) storage.set(KEYS.AUDIT, []);
  if (!storage.get(KEYS.SETTINGS)) {
    storage.set(KEYS.SETTINGS, { backupTime: '23:00', precisionPct: 1, schemaVersion: 1 });
  }
  if (!storage.get(KEYS.SEQUENCE)) storage.set(KEYS.SEQUENCE, { byDate: {} });
  if (!storage.get(KEYS.BACKUP_META)) storage.set(KEYS.BACKUP_META, { lastBackupDate: '', lastBackupAt: '' });
}

/* =========================================================================
 * 4) 인증 / 세션
 * ========================================================================= */
var auth = {
  current: function () { return storage.get(KEYS.SESSION); },
  hasRole: function (role) {
    var s = auth.current(); return !!(s && s.roles && s.roles.indexOf(role) !== -1);
  },
  hasAnyRole: function (roles) {
    var s = auth.current(); if (!s) return false;
    for (var i = 0; i < roles.length; i++) if (s.roles.indexOf(roles[i]) !== -1) return true;
    return false;
  },
  login: function (userId, password) {
    var users = storage.get(KEYS.USERS, []);
    var u = users.find(function (x) { return x.userId === userId; });
    if (!u || !u.active || u.passwordPlain !== password) {
      audit.append('LOGIN_FAIL', userId, userId, null, null, null);
      return { ok: false, msg: 'ID 또는 비밀번호가 올바르지 않습니다.' };
    }
    var session = { userId: u.userId, name: u.name, roles: u.roles, loginAt: formatKst() };
    storage.set(KEYS.SESSION, session);
    audit.append('LOGIN_SUCCESS', u.userId, u.userId, null, null, null);
    return { ok: true, session: session };
  },
  logout: function () {
    var s = auth.current();
    if (s) audit.append('LOGOUT', s.userId, s.userId, null, null, null);
    storage.remove(KEYS.SESSION);
  }
};

/* =========================================================================
 * 5) 감사추적
 * ========================================================================= */
var audit = {
  append: function (action, userId, target, before, after, reason, meta) {
    var events = storage.get(KEYS.AUDIT, []);
    events.push({
      eventId: uid('evt_'), timestamp: formatKst(),
      userId: userId || 'anonymous', action: action, target: target || '',
      before: before == null ? null : before,
      after: after == null ? null : after,
      reason: reason || '', meta: meta || null
    });
    storage.set(KEYS.AUDIT, events);
  },
  list: function () { return storage.get(KEYS.AUDIT, []); }
};

/* =========================================================================
 * 6) 결재 워크플로우 + 레코드
 * ========================================================================= */
var record = {
  list: function () { return storage.get(KEYS.RECORDS, []); },
  byId: function (id) { return record.list().find(function (r) { return r.recordId === id; }); },
  isLocked: function (rec) { return rec && (rec.status === STATUS.APPROVED || rec.status === STATUS.PRINTED); },
  create: function (data, userId) {
    var rec = {
      recordId: uid('rec_'), documentNo: null,
      productName: data.productName, lotNo: data.lotNo, testDate: data.testDate,
      equipment: data.equipment, testMethod: data.testMethod,
      acceptanceCriteria: data.acceptanceCriteria,
      resultValue: Number(data.resultValue), resultUnit: data.resultUnit,
      status: STATUS.DRAFT,
      createdBy: userId, createdAt: formatKst(),
      printCount: 0
    };
    var list = record.list(); list.push(rec); storage.set(KEYS.RECORDS, list);
    audit.append('RECORD_CREATE', userId, rec.recordId, null, rec, null);
    return rec;
  },
  update: function (recordId, patch, reason, userId) {
    var list = record.list();
    var idx = list.findIndex(function (r) { return r.recordId === recordId; });
    if (idx < 0) throw new Error('레코드를 찾을 수 없습니다.');
    var rec = list[idx];
    if (record.isLocked(rec)) throw new Error('승인된 레코드는 수정할 수 없습니다. (URS 16)');
    if (rec.status !== STATUS.DRAFT && rec.status !== STATUS.REJECTED) throw new Error('현재 상태에서는 수정할 수 없습니다.');
    if (!reason || reason.trim().length < 5) throw new Error('수정 사유를 5자 이상 입력해야 합니다. (URS 13)');
    var hist = storage.get(KEYS.HISTORY, []);
    var changed = {};
    Object.keys(patch).forEach(function (k) {
      var before = rec[k]; var after = patch[k];
      if (k === 'resultValue') after = Number(after);
      if (before !== after) {
        hist.push({
          historyId: uid('h_'), recordId: rec.recordId, field: k,
          beforeValue: before, afterValue: after, reason: reason,
          changedBy: userId, changedAt: formatKst()
        });
        rec[k] = after; changed[k] = { before: before, after: after };
      }
    });
    storage.set(KEYS.HISTORY, hist);
    list[idx] = rec; storage.set(KEYS.RECORDS, list);
    audit.append('RECORD_UPDATE', userId, rec.recordId, changed, null, reason);
    return rec;
  },
  submit: function (recordId, userId) {
    var list = record.list();
    var idx = list.findIndex(function (r) { return r.recordId === recordId; });
    if (idx < 0) throw new Error('레코드를 찾을 수 없습니다.');
    var rec = list[idx];
    if (rec.status !== STATUS.DRAFT && rec.status !== STATUS.REJECTED) throw new Error('이미 제출된 레코드입니다.');
    var before = rec.status; rec.status = STATUS.SUBMITTED; rec.submittedAt = formatKst();
    list[idx] = rec; storage.set(KEYS.RECORDS, list);
    audit.append('RECORD_SUBMIT', userId, rec.recordId, before, STATUS.SUBMITTED);
  },
  approve: function (recordId, userId, password) {
    var users = storage.get(KEYS.USERS, []);
    var u = users.find(function (x) { return x.userId === userId; });
    if (!u || u.passwordPlain !== password) throw new Error('승인자 비밀번호가 일치하지 않습니다.');
    var list = record.list();
    var idx = list.findIndex(function (r) { return r.recordId === recordId; });
    if (idx < 0) throw new Error('레코드를 찾을 수 없습니다.');
    var rec = list[idx];
    if (rec.status !== STATUS.SUBMITTED) throw new Error('승인 대기 상태가 아닙니다.');
    rec.status = STATUS.APPROVED; rec.approvedBy = userId; rec.approvedAt = formatKst();
    list[idx] = rec; storage.set(KEYS.RECORDS, list);
    audit.append('RECORD_APPROVE', userId, rec.recordId, STATUS.SUBMITTED, STATUS.APPROVED);
  },
  reject: function (recordId, userId, reason) {
    if (!reason || reason.trim().length < 5) throw new Error('반려 사유를 5자 이상 입력해야 합니다.');
    var list = record.list();
    var idx = list.findIndex(function (r) { return r.recordId === recordId; });
    if (idx < 0) throw new Error('레코드를 찾을 수 없습니다.');
    var rec = list[idx];
    if (rec.status !== STATUS.SUBMITTED) throw new Error('승인 대기 상태가 아닙니다.');
    rec.status = STATUS.REJECTED; rec.rejectedBy = userId; rec.rejectedAt = formatKst(); rec.rejectReason = reason;
    list[idx] = rec; storage.set(KEYS.RECORDS, list);
    audit.append('RECORD_REJECT', userId, rec.recordId, STATUS.SUBMITTED, STATUS.REJECTED, reason);
  },
  print: function (recordId, userId) {
    var list = record.list();
    var idx = list.findIndex(function (r) { return r.recordId === recordId; });
    if (idx < 0) throw new Error('레코드를 찾을 수 없습니다.');
    var rec = list[idx];
    if (rec.status !== STATUS.APPROVED && rec.status !== STATUS.PRINTED) throw new Error('승인되지 않은 레코드는 출력할 수 없습니다. (URS 3)');
    if (!rec.documentNo) rec.documentNo = nextDocumentNo();
    rec.status = STATUS.PRINTED;
    rec.printedBy = userId; rec.printedAt = formatKst();
    rec.printCount = (rec.printCount || 0) + 1;
    list[idx] = rec; storage.set(KEYS.RECORDS, list);
    audit.append('RECORD_PRINT', userId, rec.documentNo, null,
      { printedBy: userId, printedAt: rec.printedAt, printCount: rec.printCount, recordId: rec.recordId });
    return rec;
  }
};

function nextDocumentNo() {
  var dateKey = formatDateKey();
  var seq = storage.get(KEYS.SEQUENCE, { byDate: {} });
  var n = (seq.byDate[dateKey] || 0) + 1;
  seq.byDate[dateKey] = n;
  storage.set(KEYS.SEQUENCE, seq);
  return 'COA-' + dateKey + '-' + String(n).padStart(3, '0');
}

/* =========================================================================
 * 7) 자동 백업 (URS 15)
 * ========================================================================= */
var backup = {
  collect: function () {
    var data = {};
    [KEYS.USERS, KEYS.RECORDS, KEYS.HISTORY, KEYS.AUDIT, KEYS.SETTINGS, KEYS.SEQUENCE, KEYS.BACKUP_META]
      .forEach(function (k) { data[k] = storage.get(k); });
    data._meta = { backupAt: formatKst(), schemaVersion: 1 };
    return data;
  },
  download: function (filename, data) {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  },
  runManual: function (userId) {
    var data = backup.collect();
    var now = new Date();
    var fname = 'coa-backup-' + formatDateKey(now) + '-' + pad2(now.getHours()) + pad2(now.getMinutes()) + pad2(now.getSeconds()) + '.json';
    backup.download(fname, data);
    var meta = storage.get(KEYS.BACKUP_META, {});
    meta.lastBackupDate = formatDateOnly(now); meta.lastBackupAt = formatKst(now);
    storage.set(KEYS.BACKUP_META, meta);
    audit.append('BACKUP_MANUAL', userId || 'system', 'manual', null, { at: meta.lastBackupAt });
  },
  checkAndRun: function () {
    var settings = storage.get(KEYS.SETTINGS);
    if (!settings || !settings.backupTime) return;
    var meta = storage.get(KEYS.BACKUP_META, { lastBackupDate: '', lastBackupAt: '' });
    var now = new Date();
    var today = formatDateOnly(now);
    var parts = settings.backupTime.split(':');
    var scheduled = new Date(now);
    scheduled.setHours(Number(parts[0]), Number(parts[1]), 0, 0);
    if (now >= scheduled && meta.lastBackupDate !== today) {
      var data = backup.collect();
      var fname = 'coa-backup-' + formatDateKey(now) + '-' + pad2(now.getHours()) + pad2(now.getMinutes()) + pad2(now.getSeconds()) + '.json';
      backup.download(fname, data);
      meta.lastBackupDate = today; meta.lastBackupAt = formatKst(now);
      storage.set(KEYS.BACKUP_META, meta);
      var s = auth.current();
      audit.append('BACKUP_RUN', s ? s.userId : 'system', 'auto', null, { scheduled: settings.backupTime, at: meta.lastBackupAt });
      toast.show('자동 백업이 실행되었습니다. (예정: ' + settings.backupTime + ')', 'ok');
    }
  },
  importFromFile: function (file, userId, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var data = JSON.parse(e.target.result);
        [KEYS.USERS, KEYS.RECORDS, KEYS.HISTORY, KEYS.AUDIT, KEYS.SETTINGS, KEYS.SEQUENCE, KEYS.BACKUP_META]
          .forEach(function (k) { if (data[k] != null) storage.set(k, data[k]); });
        audit.append('BACKUP_IMPORT', userId || 'system', file.name, null, { fileName: file.name });
        cb(null);
      } catch (err) { cb(err); }
    };
    reader.onerror = function () { cb(new Error('파일을 읽을 수 없습니다.')); };
    reader.readAsText(file);
  }
};

/* =========================================================================
 * 8) Toast / Modal helpers
 * ========================================================================= */
var toast = {
  show: function (msg, kind) {
    kind = kind || 'info';
    var root = document.getElementById('toast-root');
    var el = document.createElement('div');
    el.className = 'toast ' + kind; el.textContent = msg;
    root.appendChild(el);
    setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 3500);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4000);
  }
};
var modal = {
  open: function (htmlContent, onMount) {
    var root = document.getElementById('modal-root');
    root.innerHTML = '<div class="modal-bg"><div class="modal">' + htmlContent + '</div></div>';
    if (onMount) onMount(root);
  },
  close: function () { document.getElementById('modal-root').innerHTML = ''; }
};

/* =========================================================================
 * 9) 라우터 + 화면
 * ========================================================================= */
var routes = {};
function route(path, fn, allowedRoles) {
  routes[path] = { fn: fn, roles: allowedRoles || null };
}
function navigate(hash) { window.location.hash = hash; }

function renderRoute() {
  var hash = window.location.hash.replace(/^#/, '') || '/login';
  var session = auth.current();
  if (hash !== '/login' && !session) { navigate('/login'); return; }
  if (hash === '/login' && session) { navigate('/dashboard'); return; }

  var matched = null; var params = {};
  Object.keys(routes).forEach(function (pattern) {
    if (matched) return;
    var rx = new RegExp('^' + pattern.replace(/:[a-zA-Z]+/g, '([^/]+)') + '$');
    var m = hash.match(rx);
    if (m) {
      matched = routes[pattern];
      var keys = (pattern.match(/:[a-zA-Z]+/g) || []).map(function (k) { return k.slice(1); });
      keys.forEach(function (k, i) { params[k] = m[i + 1]; });
    }
  });
  if (!matched) { navigate('/dashboard'); return; }
  if (matched.roles && session && !auth.hasAnyRole(matched.roles)) {
    toast.show('해당 화면에 접근할 권한이 없습니다.', 'warn');
    navigate('/dashboard'); return;
  }
  matched.fn(params);
}

function formField(id, label, value, required, type) {
  type = type || 'text';
  var input;
  if (type === 'textarea') {
    input = '<textarea id="' + id + '" rows="2">' + escapeHtml(value || '') + '</textarea>';
  } else {
    input = '<input id="' + id + '" type="' + type + '" value="' + escapeHtml(value == null ? '' : value) + '">';
  }
  return '<div class="form-row" data-field="' + id + '">' +
    '<label class="' + (required ? 'req' : '') + '">' + label + '</label>' +
    '<div>' + input + '<small class="field-error" style="display:none"></small></div></div>';
}

function collectRecordForm() {
  var fields = [
    { id: 'rc-product',  key: 'productName',        label: '제품명' },
    { id: 'rc-lot',      key: 'lotNo',              label: 'Lot No' },
    { id: 'rc-date',     key: 'testDate',           label: '시험일자' },
    { id: 'rc-equip',    key: 'equipment',          label: '사용 장비' },
    { id: 'rc-method',   key: 'testMethod',         label: '시험 방법' },
    { id: 'rc-criteria', key: 'acceptanceCriteria', label: '허용 기준' },
    { id: 'rc-value',    key: 'resultValue',        label: '결과값', numeric: true },
    { id: 'rc-unit',     key: 'resultUnit',         label: '단위' }
  ];
  var data = {}; var missing = []; var firstMissing = null;
  fields.forEach(function (f) {
    var row = document.querySelector('[data-field="' + f.id + '"]');
    var inp = document.getElementById(f.id);
    var v = inp.value == null ? '' : String(inp.value).trim();
    var err = row.querySelector('.field-error');
    row.classList.remove('invalid'); err.style.display = 'none';
    if (!v) { missing.push(f.label); row.classList.add('invalid');
      err.textContent = '필수 항목입니다.'; err.style.display = 'block';
      if (!firstMissing) firstMissing = inp; return;
    }
    if (f.numeric) {
      var n = Number(v);
      if (!isFinite(n)) { missing.push(f.label + '(숫자)'); row.classList.add('invalid');
        err.textContent = '숫자만 입력 가능합니다.'; err.style.display = 'block';
        if (!firstMissing) firstMissing = inp; return;
      }
      data[f.key] = n;
    } else {
      data[f.key] = v;
    }
  });
  if (missing.length) {
    toast.show('다음 항목이 누락되었습니다: ' + missing.join(', '), 'error');
    if (firstMissing) firstMissing.focus();
    return null;
  }
  return data;
}

function recordsTable(list, mode) {
  if (!list.length) return '<div class="empty">레코드가 없습니다.</div>';
  var rows = list.map(function (r) {
    var actions = '';
    if (mode === 'tester') {
      if (r.status === STATUS.DRAFT || r.status === STATUS.REJECTED) {
        actions += '<button class="btn sm" data-act="edit" data-id="' + r.recordId + '">수정</button> ';
        actions += '<button class="btn sm primary" data-act="submit" data-id="' + r.recordId + '">제출</button> ';
      }
      actions += '<button class="btn sm" data-act="detail" data-id="' + r.recordId + '">상세</button>';
    } else if (mode === 'approver') {
      actions += '<button class="btn sm primary" data-act="approve" data-id="' + r.recordId + '">승인</button> ';
      actions += '<button class="btn sm warn" data-act="reject" data-id="' + r.recordId + '">반려</button> ';
      actions += '<button class="btn sm" data-act="detail" data-id="' + r.recordId + '">상세</button>';
    } else if (mode === 'coa') {
      var canPrint = (r.status === STATUS.APPROVED || r.status === STATUS.PRINTED) && auth.hasAnyRole([ROLES.APPROVER, ROLES.ADMIN]);
      actions += '<button class="btn sm primary" data-act="print" data-id="' + r.recordId + '"' + (canPrint ? '' : ' disabled') + '>인쇄</button> ';
      actions += '<button class="btn sm" data-act="detail" data-id="' + r.recordId + '">상세</button>';
    }
    return '<tr>' +
      '<td>' + escapeHtml(r.documentNo || '-') + '</td>' +
      '<td>' + escapeHtml(r.productName) + '</td>' +
      '<td>' + escapeHtml(r.lotNo) + '</td>' +
      '<td>' + escapeHtml(r.testDate) + '</td>' +
      '<td>' + escapeHtml(r.createdBy) + '</td>' +
      '<td><span class="badge ' + r.status.toLowerCase() + '">' + STATUS_LABEL[r.status] + '</span></td>' +
      '<td>' + escapeHtml(r.createdAt) + '</td>' +
      '<td>' + actions + '</td>' +
      '</tr>';
  }).join('');
  return '<table class="list">' +
    '<thead><tr><th>문서번호</th><th>제품명</th><th>Lot No</th><th>시험일자</th><th>작성자</th><th>상태</th><th>작성일시</th><th>액션</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>';
}

function bindRecordsTableActions(mode) {
  document.querySelectorAll('button[data-act]').forEach(function (btn) {
    btn.onclick = function () {
      var id = btn.getAttribute('data-id');
      var act = btn.getAttribute('data-act');
      var rec = record.byId(id);
      if (act === 'edit') openEditModal(rec);
      else if (act === 'submit') openSubmitConfirm(rec);
      else if (act === 'detail') openDetailModal(rec);
      else if (act === 'approve') openApproveModal(rec);
      else if (act === 'reject') openRejectModal(rec);
      else if (act === 'print') openPrintScreen(rec);
    };
  });
}

          var row = document.querySelector('[data-field="' + f[0] + '"]');
          var inp = document.getElementById(f[0]);
          var v = String(inp.value || '').trim(); var err = row.querySelector('.field-error');
          row.classList.remove('invalid'); err.style.display = 'none';
          if (!v) { ok = false; row.classList.add('invalid'); err.textContent = '필수 항목입니다.'; err.style.display = 'block'; return; }
          if (f[3]) { var n = Number(v); if (!isFinite(n)) { ok = false; row.classList.add('invalid'); err.textContent = '숫자만 입력'; err.style.display = 'block'; return; } patch[f[1]] = n; }
          else patch[f[1]] = v;
        });
        if (!ok) { toast.show('필수 항목을 확인하세요.', 'error'); return; }
        try {
          var session = auth.current();
          record.update(rec.recordId, patch, reasonEl.value.trim(), session.userId);
          modal.close(); toast.show('수정되었습니다.', 'ok'); renderRoute();
        } catch (e) { toast.show(e.message, 'error'); }
      };
    }
  );
}

route('/coa/:id/print', function (params) {
  var rec = record.byId(params.id);

  var settings = storage.get(KEYS.SETTINGS);
  var pct = settings.precisionPct || 1;
  var users = storage.get(KEYS.USERS, []);
  var creator = users.find(function (u) { return u.userId === rec.createdBy; }) || { name: rec.createdBy };
  var approver = users.find(function (u) { return u.userId === rec.approvedBy; }) || { name: rec.approvedBy || '-' };
  var printer = users.find(function (u) { return u.userId === rec.printedBy; }) || { name: rec.printedBy || '-' };

  var tol = rec.resultValue * pct / 100;

      '<div class="row between" style="margin-bottom:10px">' +
      '<div class="muted">총 ' + events.length + '건. 모든 시스템 행위가 자동 기록됩니다. (수정/삭제 불가)</div>' +
      '<button class="btn" id="btn-export-csv">CSV 내보내기</button></div>' +
      (events.length ? '<table class="list"><thead><tr><th>일시</th><th>사용자</th><th>액션</th><th>대상</th><th>Before</th><th>After</th><th>사유</th></tr></thead><tbody>' + rows + '</tbody></table>'
                     : '<div class="empty">감사 이벤트가 없습니다.</div>') +
    '</div>',
    function () {
      document.getElementById('btn-export-csv').onclick = exportAuditCsv;
    }, [ROLES.ADMIN]
  );
}, [ROLES.ADMIN]);

function exportAuditCsv() {
  var events = audit.list();
  var head = ['timestamp','userId','action','target','before','after','reason'];
  var lines = [head.join(',')];
  events.forEach(function (e) {
    var row = [e.timestamp, e.userId, e.action, e.target,
               e.before == null ? '' : (typeof e.before === 'object' ? JSON.stringify(e.before) : String(e.before)),
               e.after == null ? '' : (typeof e.after === 'object' ? JSON.stringify(e.after) : String(e.after)),
               e.reason || ''];
    lines.push(row.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','));
  });
  var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var now = new Date();
  a.href = url; a.download = 'coa-audit-' + formatDateKey(now) + '-' + pad2(now.getHours()) + pad2(now.getMinutes()) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  audit.append('AUDIT_EXPORT', auth.current().userId, 'csv', null, { count: events.length });
  toast.show('감사추적 CSV가 다운로드되었습니다.', 'ok');
}

/* ---------- View: 환경설정 ---------- */
route('/settings', function () {
  var s = storage.get(KEYS.SETTINGS);
  var meta = storage.get(KEYS.BACKUP_META, {});
  renderShell('#/settings',
    '<h1 class="page-title">환경설정</h1>' +
    '<div class="card">' +
      '<h2>자동 백업 (URS 15)</h2>' +
      '<div class="form-row"><label class="req">자동 백업 시각</label>' +
        '<div><input id="set-backup-time" type="time" value="' + escapeHtml(s.backupTime) + '">' +
        '<small class="muted" style="display:block;margin-top:4px">매일 이 시각 이후 페이지 로드 시 자동 백업을 실행합니다. (멱등)</small></div></div>' +
      '<div class="form-row"><label>마지막 백업 일시</label><div><b>' + escapeHtml(meta.lastBackupAt || '-') + '</b></div></div>' +
      '<div class="form-row"><label>마지막 백업 일자</label><div>' + escapeHtml(meta.lastBackupDate || '-') + '</div></div>' +
      '<div class="form-actions">' +
        '<button class="btn warn" id="btn-reset">데이터 리셋</button>' +
        '<input type="file" id="file-import" accept=".json" style="display:none">' +
        '<button class="btn" id="btn-import">백업 가져오기</button>' +
        '<button class="btn" id="btn-backup-now">지금 백업하기</button>' +
        '<button class="btn primary" id="btn-save">설정 저장</button>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<h2>결과 정밀도 (URS 8)</h2>' +
      '<div class="form-row"><label class="req">정밀도 (±%)</label>' +
        '<div><input id="set-precision" type="number" min="0" step="0.1" value="' + s.precisionPct + '" style="width:100px">' +
        '<small class="muted" style="display:block;margin-top:4px">COA 출력 시 결과값 옆에 ±N% 허용범위가 표시됩니다.</small></div></div>' +
    '</div>',
    function () {
      document.getElementById('btn-save').onclick = function () {
        var bt = document.getElementById('set-backup-time').value;
        var pp = Number(document.getElementById('set-precision').value);
        if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(bt)) { toast.show('백업 시각 형식이 올바르지 않습니다.', 'error'); return; }
        if (!isFinite(pp) || pp < 0) { toast.show('정밀도는 0 이상의 숫자.', 'error'); return; }
        var before = { backupTime: s.backupTime, precisionPct: s.precisionPct };
        s.backupTime = bt; s.precisionPct = pp;
        storage.set(KEYS.SETTINGS, s);
        audit.append('SETTINGS_UPDATE', auth.current().userId, 'settings', before, { backupTime: bt, precisionPct: pp });
        toast.show('설정이 저장되었습니다.', 'ok'); renderRoute();
      };
      document.getElementById('btn-backup-now').onclick = function () {
        backup.runManual(auth.current().userId);
        toast.show('수동 백업 파일이 다운로드되었습니다.', 'ok'); renderRoute();
      };
      document.getElementById('btn-import').onclick = function () { document.getElementById('file-import').click(); };
      document.getElementById('file-import').onchange = function (e) {
        if (!e.target.files[0]) return;
        if (!confirm('현재 데이터를 백업 파일로 덮어씁니다. 계속하시겠습니까?')) return;
        backup.importFromFile(e.target.files[0], auth.current().userId, function (err) {
          if (err) { toast.show('가져오기 실패: ' + err.message, 'error'); return; }
          toast.show('가져오기 완료. 다시 로그인하세요.', 'ok');
          auth.logout(); navigate('/login');
        });
      };
      document.getElementById('btn-reset').onclick = function () {
        var reason = prompt('데이터 리셋 사유를 입력하세요 (5자 이상):');
        if (!reason || reason.trim().length < 5) { toast.show('사유 미입력으로 취소되었습니다.', 'warn'); return; }
        if (!confirm('모든 데이터(사용자/레코드/이력/감사/설정)가 초기화됩니다. 정말 진행하시겠습니까?')) return;
        var userId = auth.current().userId;
        [KEYS.USERS, KEYS.RECORDS, KEYS.HISTORY, KEYS.AUDIT, KEYS.SETTINGS, KEYS.SEQUENCE, KEYS.BACKUP_META, KEYS.SESSION]
          .forEach(function (k) { storage.remove(k); });
        seedIfEmpty();
        audit.append('DATA_RESET', userId, 'all', null, null, reason);
        toast.show('데이터가 리셋되었습니다.', 'ok'); navigate('/login');
      };
    }, [ROLES.ADMIN]
  );
}, [ROLES.ADMIN]);

/* =========================================================================
 * 10) 초기화
 * ========================================================================= */
window.addEventListener('hashchange', renderRoute);
document.addEventListener('DOMContentLoaded', function () {
  seedIfEmpty();
  backup.checkAndRun();
  renderRoute();
});

// 디버그/테스트용 전역 노출 (콘솔에서 검증 가능)
window.COA = { storage: storage, auth: auth, record: record, audit: audit, backup: backup, KEYS: KEYS };

})();
</script>
