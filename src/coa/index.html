<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KPBMA GMP 시험성적서(COA) 발행 시스템</title>
  <!-- Main CSS Link -->
  <link rel="stylesheet" href="../shared/css/common.css">
  <style>
    /* System Specific Styles overriding or extending common.css */
    .shell {
      display: flex;
      min-height: calc(100vh - 64px);
    }
    
    .sidenav {
      width: 220px;
      background: var(--color-bg);
      border-right: 1px solid var(--color-border);
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .sidenav .group {
      padding: 8px 24px;
      color: var(--color-text-muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .sidenav a {
      display: block;
      padding: 10px 24px;
      color: var(--color-text);
      text-decoration: none;
      font-weight: 500;
      border-left: 4px solid transparent;
      transition: all 0.2s ease;
    }
    
    .sidenav a:hover {
      background-color: var(--color-bg-muted);
      color: var(--color-primary);
    }
    
    .sidenav a.active {
      background-color: var(--color-primary-soft);
      border-left-color: var(--color-primary);
      color: var(--color-primary);
      font-weight: 700;
    }
    
    .main-panel {
      flex: 1;
      padding: 32px 40px;
      background-color: var(--color-bg-muted);
      overflow-y: auto;
    }
    
    /* Document Cards */
    .card {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-card);
    }
    
    .card h2 {
      font-size: 15px;
      margin-bottom: 18px;
    }
    
    .grid {
      display: grid;
      gap: 16px;
    }
    
    .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    
    .kpi {
      background: var(--color-bg-muted);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
    }
    
    .kpi .label {
      color: var(--color-text-muted);
      font-size: 12.5px;
      font-weight: 600;
    }
    
    .kpi .value {
      font-size: 26px;
      font-weight: 800;
      color: var(--color-primary-dark);
      margin-top: 6px;
    }
    
    /* GxP Badges conforming to system statuses */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    
    .badge.draft { background-color: #FEF08A; color: #854D0E; }
    .badge.submitted { background-color: #BFDBFE; color: #1E40AF; }
    .badge.approved { background-color: #A7F3D0; color: #065F46; }
    .badge.printed { background-color: #DDD6FE; color: #5B21B6; }
    .badge.rejected { background-color: #FCA5A5; color: #991B1B; }
    
    /* Forms Row Layout */
    .form-row {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 16px;
      align-items: start;
      margin-bottom: 16px;
    }
    
    .form-row label {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--color-text);
      padding-top: 10px;
    }
    
    .form-row label.req::after {
      content: " *";
      color: var(--color-danger);
    }
    
    .form-row input, .form-row select, .form-row textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-input);
      font-size: 14px;
      outline: none;
      transition: all 0.15s ease;
    }
    
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(0, 114, 206, 0.15);
    }
    
    .form-row.invalid input, .form-row.invalid select, .form-row.invalid textarea {
      border-color: var(--color-danger);
      background-color: #FFF5F5;
    }
    
    .form-row .field-error {
      color: var(--color-danger);
      font-size: 12px;
      margin-top: 6px;
      font-weight: 600;
    }
    
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }
    
    /* Dual-Tab Audit Trail Layout */
    .audit-tabs {
      display: flex;
      border-bottom: 2px solid var(--color-border);
      margin-bottom: 20px;
      gap: 8px;
    }
    
    .audit-tab {
      padding: 10px 20px;
      font-weight: 700;
      cursor: pointer;
      color: var(--color-text-muted);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s ease;
    }
    
    .audit-tab:hover {
      color: var(--color-primary);
    }
    
    .audit-tab.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
    }
    
    /* Table designs */
    table.list {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      background: var(--color-bg);
      border-radius: 8px;
      overflow: hidden;
    }
    
    table.list th, table.list td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--color-border);
    }
    
    table.list th {
      background-color: var(--color-bg-muted);
      font-weight: 700;
      color: var(--color-primary-dark);
    }
    
    table.list tbody tr:hover {
      background-color: var(--color-primary-soft);
    }
    
    /* Modal Structure */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(22, 58, 95, 0.4); /* Dark blue overlay */
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal {
      background: var(--color-bg);
      border-radius: var(--radius-card);
      padding: 28px;
      width: 520px;
      max-width: 90vw;
      box-shadow: 0 20px 40px rgba(22, 58, 95, 0.15);
      border: 1px solid var(--color-border);
    }
    
    .modal h3 {
      font-size: 17px;
      margin-bottom: 18px;
      color: var(--color-primary-dark);
    }
    
    /* Toast Structure */
    .toast-wrap {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .toast {
      padding: 12px 20px;
      border-radius: 8px;
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(22, 58, 95, 0.15);
      min-width: 260px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.25s ease-out;
    }
    
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    .toast.info { background-color: var(--color-primary); }
    .toast.ok { background-color: var(--color-success); }
    .toast.warn { background-color: var(--color-warning); }
    .toast.error { background-color: var(--color-danger); }
    
    /* Printable COA Document (GMP Standard) */
    .coa-printable {
      background: #FFFFFF;
      padding: 40px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      max-width: 800px;
      margin: 0 auto;
      color: #000000; /* Print black */
    }
    
    .coa-printable h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 8px;
      color: #000000;
    }
    
    .coa-printable .coa-sub {
      text-align: center;
      color: var(--color-text-muted);
      font-size: 13px;
      margin-bottom: 32px;
    }
    
    .coa-printable table.doc-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
    }
    
    .coa-printable table.doc-table th, .coa-printable table.doc-table td {
      border: 1.5px solid #111111;
      padding: 10px 12px;
      font-size: 13.5px;
    }
    
    .coa-printable table.doc-table th {
      background: #F2F5F8;
      width: 22%;
      text-align: left;
      font-weight: 700;
      color: #000000;
    }
    
    .coa-printable .stamp-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 32px;
    }
    
    .coa-printable .stamp {
      border: 1.5px solid #111111;
      padding: 14px;
      min-height: 90px;
      background: #FAFCFF;
    }
    
    .coa-printable .stamp .ttl {
      font-size: 11px;
      font-weight: 700;
      color: var(--color-text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    
    .coa-printable .stamp .body {
      font-size: 13px;
      line-height: 1.6;
    }
    
    /* Login Page Styling */
    .login-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary) 100%);
    }
    
    .login-box {
      background: #FFFFFF;
      padding: 40px;
      border-radius: var(--radius-card);
      width: 420px;
      box-shadow: 0 20px 48px rgba(22, 58, 95, 0.3);
    }
    
    .login-box .logo-area {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .login-box .logo-area img {
      max-height: 48px;
    }
    
    .login-box h1 {
      font-size: 18.5px;
      margin-bottom: 8px;
      text-align: center;
    }
    
    .login-box .sub {
      color: var(--color-text-muted);
      font-size: 12.5px;
      margin-bottom: 28px;
      text-align: center;
    }
    
    .login-box .seed-info {
      background: var(--color-bg-muted);
      border: 1px solid var(--color-border);
      padding: 14px;
      border-radius: 8px;
      font-size: 12.5px;
      color: var(--color-text-muted);
      margin-top: 20px;
      line-height: 1.7;
    }
    
    .login-box .seed-info b {
      color: var(--color-primary-dark);
    }

    /* Print settings */
    @media print {
      body { background: #FFFFFF !important; }
      .kpbma-topbar, .sidenav, .toast-wrap, .no-print, .form-actions, .kpbma-footer {
        display: none !important;
      }
      .main-panel {
        padding: 0 !important;
        background: #FFFFFF !important;
      }
      .coa-printable {
        border: none !important;
        padding: 0 !important;
        max-width: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- UI gets injected dynamically here -->
  </div>
  <div id="modal-root"></div>
  <div class="toast-wrap" id="toast-root"></div>

  <!-- Router/Application Script Module -->
  <script type="module" src="app.js"></script>
</body>
</html>
